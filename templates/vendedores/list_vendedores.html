{% extends 'base.html' %}

{% block content %}
<h1>Lista de Vendedores</h1>
<a href="{{ url_for('vendedores_bp.add_vendedor') }}">Añadir Vendedor</a>
<table>
    <thead>
        <tr>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for vendedor in vendedores %}
        <tr>
            <td>{{ vendedor.DNI }}</td>
            <td>{{ vendedor.nombre }}</td>
            <td>{{ vendedor.apellido }}</td>
            <td>{{ vendedor.telefono }}</td>
            <td>
                <a href="{{ url_for('vendedores_bp.edit_vendedor', DNI=vendedor.DNI) }}">Editar</a>
                <form action="{{ url_for('vendedores_bp.delete_vendedor', DNI=vendedor.DNI) }}" method="post" style="display:inline;">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
