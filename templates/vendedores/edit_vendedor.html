{% extends 'base.html' %}

{% block content %}
<h1>Editar Vendedor</h1>
<form action="{{ url_for('vendedores_bp.edit_vendedor', DNI=vendedor.DNI) }}" method="post">
    <label for="DNI">DNI:</label>
    <input type="text" name="DNI" id="DNI" value="{{ vendedor.DNI }}" readonly>
    <label for="nombre">Nombre:</label>
    <input type="text" name="nombre" id="nombre" value="{{ vendedor.nombre }}">
    <label for="apellido">Apellido:</label>
    <input type="text" name="apellido" id="apellido" value="{{ vendedor.apellido }}">
    <label for="telefono">Teléfono:</label>
    <input type="text" name="telefono" id="telefono" value="{{ vendedor.telefono }}">
    <button type="submit">Guardar</button>
</form>
{% endblock %}
