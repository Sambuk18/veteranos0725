{% extends 'base.html' %}

{% block content %}
<h1>Lista de Dirigentes</h1>
<a href="{{ url_for('dirigentes_bp.add_dirigente') }}">Añadir Dirigente</a>
<table>
    <thead>
        <tr>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Cargo</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for dirigente in dirigentes %}
        <tr>
            <td>{{ dirigente.DNI }}</td>
            <td>{{ dirigente.nombre }}</td>
            <td>{{ dirigente.apellido }}</td>
            <td>{{ dirigente.cargo }}</td>
            <td>
                <a href="{{ url_for('dirigentes_bp.edit_dirigente', DNI=dirigente.DNI) }}">Editar</a>
                <form action="{{ url_for('dirigentes_bp.delete_dirigente', DNI=dirigente.DNI) }}" method="post" style="display:inline;">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
