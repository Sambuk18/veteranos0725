{% extends 'base.html' %}

{% block content %}
<h1>Lista de Árbitros</h1>
<a href="{{ url_for('arbitros_bp.add_arbitro') }}">Añadir Árbitro</a>
<table>
    <thead>
        <tr>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Licencia</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for arbitro in arbitros %}
        <tr>
            <td>{{ arbitro.DNI }}</td>
            <td>{{ arbitro.nombre }}</td>
            <td>{{ arbitro.apellido }}</td>
            <td>{{ arbitro.licencia }}</td>
            <td>
                <a href="{{ url_for('arbitros_bp.edit_arbitro', DNI=arbitro.DNI) }}">Editar</a>
                <form action="{{ url_for('arbitros_bp.delete_arbitro', DNI=arbitro.DNI) }}" method="post" style="display:inline;">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
