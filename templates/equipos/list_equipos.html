{% extends 'base.html' %}

{% block content %}
<h1>Lista de Equipos</h1>
<a href="{{ url_for('equipos_bp.add_equipo') }}">Añadir Equipo</a>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre Equipo</th>
            <th>Fecha Creación</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for equipo in equipos %}
        <tr>
            <td>{{ equipo.id_equipo }}</td>
            <td>{{ equipo.nombre_equipo }}</td>
            <td>{{ equipo.fecha_creacion }}</td>
            <td>
                <a href="{{ url_for('equipos_bp.edit_equipo', id=equipo.id_equipo) }}">Editar</a>
                <form action="{{ url_for('equipos_bp.delete_equipo', id=equipo.id_equipo) }}" method="post" style="display:inline;">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
