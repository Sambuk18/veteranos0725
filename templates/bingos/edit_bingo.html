{% extends 'base.html' %}

{% block content %}
<h1>Editar Bingo</h1>
<form action="{{ url_for('bingos_bp.edit_bingo', id=bingo.id_bingo) }}" method="post">
    <label for="fecha">Fecha:</label>
    <input type="date" name="fecha" id="fecha" value="{{ bingo.fecha }}" required>
    
    <label for="ubicacion">Ubicación:</label>
    <input type="text" name="ubicacion" id="ubicacion" value="{{ bingo.ubicacion }}">
    
    <label for="DNI_vendedor">DNI Vendedor:</label>
    <select name="DNI_vendedor" id="DNI_vendedor" required>
        {% for vendedor in vendedores %}
        <option value="{{ vendedor.DNI }}" {% if vendedor.DNI == bingo.DNI_vendedor %}selected{% endif %}>
            {{ vendedor.DNI }} - {{ vendedor.nombre }} {{ vendedor.apellido }}
        </option>
        {% endfor %}
    </select>
    
    <label for="DNI_comprador">DNI Comprador:</label>
    <input type="text" name="DNI_comprador" id="DNI_comprador" value="{{ bingo.DNI_comprador }}" required>
    
    <label for="anocarton">Año del Cartón:</label>
    <input type="number" name="anocarton" id="anocarton" value="{{ bingo.anocarton if bingo.anocarton else '' }}">
    
    <label for="Nrocarton">Número del Cartón (4 dígitos):</label>
    <input type="number" name="Nrocarton" id="Nrocarton" 
           value="{{ bingo.Nrocarton if bingo.Nrocarton else '' }}" min="0000" max="3999">
    
    <button type="submit">Guardar</button>
</form>
{% endblock %}
